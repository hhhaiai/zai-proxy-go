services:
  zai-proxy:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BROWSER_POOL_SIZE=2
      - LOG_LEVEL=info
      - ZAI_ENABLE_ANONYMOUS=true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
